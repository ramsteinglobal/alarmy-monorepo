name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Verify everything (same as local `npm run verify`)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # SAME command local devs run. Covers: ESLint + Prettier check +
      # TypeScript typecheck + Jest + backend install/build.
      # The APK itself is built by android-apk.yml (same npm scripts).
      - name: Run all checks and backend build
        run: npm run verify
