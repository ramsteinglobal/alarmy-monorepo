name: Android APK Build

on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'backend/**'
      - 'ios/**'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Run JavaScript lint and type checks
        run: |
          npm run lint
          npm run typecheck

      - name: Run tests if they exist
        run: npm test -- --passWithNoTests --watch=false

  android-debug-apk:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Android SDK command-line tools
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: false
          packages: ''

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            echo "Android sdkmanager is not on PATH after SDK setup." >&2
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "ndk;27.1.12297006"

      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@v4

      - name: Install npm dependencies
        run: npm ci

      - name: Build debug APK (arm64 only, physical test phones)
        shell: bash
        run: |
          set -euo pipefail
          cd android
          ./gradlew --no-daemon --stacktrace assembleDebug -PreactNativeArchitectures=arm64-v8a

      - name: Verify APK exists and is non-empty
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ] || [ ! -s "$APK_PATH" ]; then
            echo "Expected APK build output was not created at $APK_PATH" >&2
            exit 1
          fi
          ls -lh "$APK_PATH"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wakely-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
