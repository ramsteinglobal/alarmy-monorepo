name: Android APK Build

on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'backend/**'
      - 'ios/**'
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: 'Which APK to build (same modes as local npm scripts)'
        required: false
        default: 'debug'
        type: choice
        options:
          - debug
          - release
          - both
      arch:
        description: 'ABI filter (same --arch as scripts/build-apk.mjs; "all" = every ABI)'
        required: false
        default: 'arm64-v8a'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Single source of truth defaults — same values scripts/build-apk.mjs uses locally.
  # `inputs.*` is empty on pull_request/push, so `||` falls back to the default.
  APK_ARCH: ${{ inputs.arch || 'arm64-v8a' }}
  APK_REQUESTED_MODE: ${{ inputs.mode || 'debug' }}

jobs:
  quality:
    name: Lint, typecheck, tests and backend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      # SAME checks as local `npm run verify` (lint + format + typecheck +
      # jest + backend install/build). One command = no local/CI drift.
      - name: Run all checks and backend build (same as local `npm run verify`)
        run: npm run verify

  android-apk:
    name: Build Android APK (same script as local)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Android SDK command-line tools
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: false
          packages: ''

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            echo "Android sdkmanager is not on PATH after SDK setup." >&2
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "ndk;27.1.12297006"

      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@v4

      - name: Install npm dependencies
        run: npm ci

      # IMPORTANT: this is the SAME script local devs run
      # (`npm run android:build:debug` → node scripts/build-apk.mjs).
      # No raw `./gradlew` here, so flags/arch can never drift again.
      - name: Build APK(s) with shared script
        shell: bash
        run: |
          set -euo pipefail
          MODE="${APK_REQUESTED_MODE:-debug}"
          echo "Requested mode: $MODE (arch: ${APK_ARCH:-arm64-v8a})"
          if [ "$MODE" = "both" ]; then
            npm run android:build:debug
            npm run android:build:release
          elif [ "$MODE" = "release" ]; then
            npm run android:build:release
          else
            npm run android:build:debug
          fi

      - name: List built APK(s)
        shell: bash
        run: |
          set -euo pipefail
          ls -lh android/app/build/outputs/apk/debug/ 2>/dev/null || true
          ls -lh android/app/build/outputs/apk/release/ 2>/dev/null || true

      - name: Upload debug APK artifact
        # `== ''` covers non-dispatch events where the input context is empty,
        # so push/PR runs always upload the debug APK.
        if: env.APK_REQUESTED_MODE == 'debug' || env.APK_REQUESTED_MODE == 'both' || env.APK_REQUESTED_MODE == ''
        uses: actions/upload-artifact@v4
        with:
          name: wakely-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload release APK artifact
        if: env.APK_REQUESTED_MODE == 'release' || env.APK_REQUESTED_MODE == 'both'
        uses: actions/upload-artifact@v4
        with:
          name: wakely-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
